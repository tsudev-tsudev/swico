# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: tsudev.SWICO
PackageVersion: {{VERSION}}
MinimumOSVersion: 10.0.0.0
InstallerType: inno
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
ReleaseDate: {{DATE}}
# Cong cu doc ban quyen, Defender va chay DISM/SFC nen bat buoc can quyen
# Administrator. Khai bao o day de winget xin nang quyen truoc khi chay setup.
ElevationRequirement: elevatesSelf
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/tsudev-tsudev/swico/releases/download/v{{VERSION}}/tsudev-swico_{{VERSION}}_x64-setup.exe
    InstallerSha256: {{SHA256}}
ManifestType: installer
ManifestVersion: 1.6.0
