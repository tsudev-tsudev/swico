name: Release

# Kich hoat bang tag v*. Toan bo quy trinh phat hanh chay o day - khong co
# buoc thu cong nao, vi buoc thu cong la buoc se bi quen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Phien ban theo docs/VERSIONING.md, vi du 26.8.19 hoac 26.8.19.2'
        required: true

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    env:
      # Ngu canh `secrets` KHONG dung duoc trong `if:` o cap step. Vi vay phai
      # quy doi thanh bien moi truong o cap job roi moi kiem tra. Nho vay repo
      # van phat hanh duoc (kem chu ky) trong luc cho SignPath duyet ho so.
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      # Doc phien ban TU global.json, khong ghi cung o day.
      # Runner cua GitHub co san .NET 10 SDK, ma `dotnet build` luon chon SDK
      # MOI NHAT tren may - khong ghim thi CI build bang .NET 10 con may dev
      # build bang .NET 8, ra hai ket qua phan tich khac nhau.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Xac dinh phien ban
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
                  $env:GITHUB_REF -replace '^refs/tags/v',''
               } else { '${{ github.event.inputs.version }}' }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'Khong xac dinh duoc phien ban.' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Phien ban: $v"

      # QUY UOC DAT TEN LA MOT BUOC CHAN, khong phai mot loi nhac trong tai lieu.
      # Mot so hieu sai quy uoc lot qua day se di thang ra may nguoi dung, va
      # go lai thi phai phat hanh them mot ban nua.
      #
      # Luat KHONG duoc chep lai sang PowerShell o day: goi thang vao
      # ReleaseName.Validate cua ma san xuat - luat chi ton tai o mot cho, va
      # cho do co 25 ca kiem tra. Xem docs/VERSIONING.md.
      - name: Kiem tra quy uoc dat ten
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'

          dotnet run --project tests/unittests -c Release -- --validate-release-name $v
          if ($LASTEXITCODE -ne 0) { throw "Tag v$v SAI QUY UOC dat ten - xem docs/VERSIONING.md" }

          # Tag va Directory.Build.props phai TRUNG NHAU. Neu khong, so hieu
          # trong exe se khac so hieu tren trang phat hanh, va chuc nang tu cap
          # nhat se so sanh nham - dung loai loi khong ai phat hien duoc cho toi
          # khi nguoi dung ket ma tool "khong chiu cap nhat".
          $props = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix |
                   Where-Object { $_ } | Select-Object -First 1
          if ($props -ne $v) {
            throw "Tag la v$v nhung Directory.Build.props ghi $props. " +
                  "Sua Directory.Build.props roi gan tag lai - do la nguon su that duy nhat."
          }
          Write-Host "Ten ban phat hanh: tsudev-swico_$v"

      # Bo test PHAI chay truoc khi dong goi. Phat hanh mot ban chua qua test
      # la cach nhanh nhat de mat long tin vao ca quy trinh.
      - name: Unit tests
        run: dotnet run --project tests/unittests -c Release

      - name: Publish exe
        shell: pwsh
        run: |
          dotnet publish src/Tsudev.Audit.Cli -c Release -r win-x64 -o publish `
            -p:Version=${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw 'Publish THAT BAI' }

      # --- Ky exe qua SignPath Foundation -----------------------------------
      # SignPath doc file can ky TU GitHub artifact, nen phai upload truoc va
      # truyen dung artifact-id do upload-artifact tra ve (KHONG phai run_id).
      - name: Upload exe cho SignPath
        id: exe_artifact
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swico-exe-unsigned
          path: publish/swico.exe

      - name: Ky exe (SignPath)
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: swico
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe_artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish

      # Installer phai duoc dong goi SAU khi exe da ky, de file exe ben trong
      # ban cai dat la file DA co chu ky.
      - name: Dong goi installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Khong tim thay Inno Setup 6 tai $iscc" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\innosetup\swico.iss
          if ($LASTEXITCODE -ne 0) { throw 'Dong goi installer THAT BAI' }

      - name: Upload installer cho SignPath
        id: setup_artifact
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swico-setup-unsigned
          path: packaging/output/tsudev-swico_*_x64-setup.exe

      - name: Ky installer (SignPath)
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: swico
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup_artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: packaging/output

      - name: Xac minh chu ky
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        run: |
          # Kiem tra CA chu ky LAN dau thoi gian. Chu ky khong co dau thoi gian
          # se het hieu luc khi chung chi het han - loi nay chi lo ra sau nhieu
          # thang, nen phai chan ngay tai day.
          foreach ($f in @('publish/swico.exe') + (Get-ChildItem packaging/output/tsudev-swico_*_x64-setup.exe).FullName) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($sig.Status)"
            if ($sig.Status -ne 'Valid')     { throw "Chu ky KHONG hop le: $f ($($sig.Status))" }
            if ($null -eq $sig.TimeStamperCertificate) { throw "Thieu dau thoi gian: $f" }
          }

      - name: Ban portable (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/output, packaging/portable | Out-Null
          Copy-Item publish/swico.exe, LICENSE, NOTICE, EULA.txt, PRIVACY.md,
                    THIRD-PARTY-NOTICES.md, README.md packaging/portable
          # Kem bo luat va tai lieu cua no: ban portable la ban danh cho ky
          # thuat vien cam USB di tung may, ho can sua duoc luat tai cho.
          Copy-Item src/Tsudev.Audit.Core/Rules/detection-rules.json packaging/portable
          Copy-Item docs/DETECTION-RULES.md packaging/portable
          # Dung 7-Zip (co san tren runner Windows) thay vi Compress-Archive.
          #
          # Ly do: payload swico.exe khong con duoc nen san ben trong nua, nen
          # buoc nen o day quyet dinh dung luong nguoi dung phai tai. Deflate
          # cua Compress-Archive yeu hon han - do duoc 34,2 MB so voi ~32 MB.
          # Van giu dinh dang .zip Deflate chuan de Explorer cua Windows mo
          # truc tiep duoc, khong bat nguoi dung cai them cong cu giai nen.
          $zip = "packaging/output/tsudev-swico_${{ steps.ver.outputs.version }}_x64-portable.zip"
          $7z = "$env:ProgramFiles\7-Zip\7z.exe"
          if (Test-Path $7z) {
            & $7z a -tzip -mx=9 -mm=Deflate $zip ".\packaging\portable\*" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Nen ban portable THAT BAI' }
          } else {
            Write-Host 'Khong tim thay 7-Zip, dung Compress-Archive (ty le nen kem hon).'
            Compress-Archive -Path 'packaging/portable/*' -DestinationPath $zip -Force
          }
          "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB) | Write-Host

      # SBOM: bat buoc cho phat hanh nghiem tuc, va la mot phan ho so minh bach
      # ma SignPath Foundation danh gia cao.
      - name: Sinh SBOM (CycloneDX)
        shell: pwsh
        run: |
          # Ghim phien ban cong cu. Bai hoc tu viec CI tung build bang .NET 10:
          # mot quy trinh phat hanh phai TAI LAP DUOC, khong duoc doi hanh vi vi
          # mot cong cu ben ngoai tu nang cap. CycloneDX 6 da doi tham so dong
          # lenh so voi ban 5 (-f -> -fn, -j -> -F Json) va lam hong buoc nay.
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX Tsudev.SystemAudit.sln `
            --output packaging/output `
            --filename swico-sbom.json `
            --output-format Json `
            --exclude-test-projects `
            --set-name "tsudev SWICO" `
            --set-version ${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw 'Sinh SBOM THAT BAI' }

      # Sinh SAU khi ky: manifest phai chua SHA256 cua file setup DA KY, neu
      # khong winget se tu choi vi hash khong khop file tai ve.
      - name: Sinh manifest winget
        shell: pwsh
        run: |
          $setup = (Get-ChildItem packaging/output/tsudev-swico_*_x64-setup.exe)[0].FullName
          python packaging/tools/make-winget-manifest.py `
            --version ${{ steps.ver.outputs.version }} `
            --installer $setup `
            --out packaging/winget-out
          if ($LASTEXITCODE -ne 0) { throw 'Sinh manifest winget THAT BAI' }
          Compress-Archive -Path packaging/winget-out/manifests `
            -DestinationPath "packaging/output/winget-manifest-${{ steps.ver.outputs.version }}.zip" -Force

      # Checksum la bien phap bu dap khi CHUA co chu ky so, va van huu ich sau
      # khi da co: nguoi dung tu doi chieu duoc file tai ve.
      - name: Tinh SHA-256
        shell: pwsh
        run: |
          Copy-Item publish/swico.exe packaging/output/
          Get-ChildItem packaging/output -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            } | Set-Content packaging/output/SHA256SUMS.txt -Encoding ascii
          Get-Content packaging/output/SHA256SUMS.txt

      - name: Tao GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Phai chi RO tag. Khi chay bang workflow_dispatch, github.ref la
          # "refs/heads/main" chu khong phai mot tag, va action se di tim release
          # cho "tag" do roi that bai. Chi ro tag khien ca hai cach kich hoat
          # (day tag va chay tay) deu hoat dong giong nhau.
          # Tag dung dang ngan 'v...' vi workflow nay kich hoat theo mau 'v*'.
          # Ten ban phat hanh - thu nguoi dung thuc su nhin thay - dung ten day
          # du theo quy uoc trong docs/VERSIONING.md.
          tag_name: v${{ steps.ver.outputs.version }}
          name: tsudev-swico_${{ steps.ver.outputs.version }}
          files: packaging/output/*
          generate_release_notes: true
          draft: true
          body: |
            ## Cài đặt

            Tải **`tsudev-swico_${{ steps.ver.outputs.version }}_x64-setup.exe`** bên dưới rồi chạy.

            Hoặc dùng bản **portable** (`.zip`): giải nén và chạy trực tiếp,
            không cần cài đặt, không đụng tới registry.

            > **winget chưa dùng được.** Gói chưa được nộp lên kho cộng đồng
            > `microsoft/winget-pkgs`, nên `winget install tsudev.SWICO` sẽ báo
            > *"No package found matching input criteria"*. Manifest đã sẵn sàng
            > trong `winget-manifest-${{ steps.ver.outputs.version }}.zip` đính kèm;
            > xem `docs/WINGET.md` để biết cách nộp.

            ## Xác minh file tải về

            Đối chiếu với `SHA256SUMS.txt`:

            ```powershell
            Get-FileHash .\tsudev-swico_${{ steps.ver.outputs.version }}_x64-setup.exe -Algorithm SHA256
            ```

            ## Lưu ý

            Báo cáo do công cụ tạo ra là **dữ liệu kỹ thuật để tham khảo**,
            không phải kết luận pháp lý. Xem `EULA.txt` mục 3.
