name: CI

# Build va test tren ubuntu vi day la phan re va nhanh nhat: toan bo logic
# nghiep vu nam trong Core (net8.0) va khong can Windows. Job windows chi de
# xac nhan lop adapter bien dich duoc va exe chay len duoc.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Doc phien ban TU global.json, khong ghi cung o day.
      # Runner cua GitHub co san .NET 10 SDK, ma `dotnet build` luon chon SDK
      # MOI NHAT tren may - khong ghim thi CI build bang .NET 10 con may dev
      # build bang .NET 8, ra hai ket qua phan tich khac nhau.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Tsudev.SystemAudit.sln

      - name: Build
        run: dotnet build Tsudev.SystemAudit.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet run --project tests/unittests -c Release --no-build

      # Bat so hieu sai quy uoc ngay tu luc PR, thay vi doi den luc gan tag va
      # phat hien ra khi quy trinh phat hanh da chay duoc nua duong.
      - name: Kiem tra VersionPrefix dung quy uoc dat ten
        run: |
          v=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          echo "VersionPrefix = $v"
          dotnet run --project tests/unittests -c Release --no-build -- --validate-release-name "$v"

  smoke-windows:
    name: Smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Doc phien ban TU global.json, khong ghi cung o day.
      # Runner cua GitHub co san .NET 10 SDK, ma `dotnet build` luon chon SDK
      # MOI NHAT tren may - khong ghim thi CI build bang .NET 10 con may dev
      # build bang .NET 8, ra hai ket qua phan tich khac nhau.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish single-file exe
        run: dotnet publish src/Tsudev.Audit.Cli -c Release -r win-x64 -o publish

      - name: Run --help
        run: ./publish/swico.exe --help

      # QUET THAT tren runner Windows va kiem tra DU LIEU CO THUC hay khong.
      #
      # Buoc nay ton tai vi mot loi that da tung xay ra: bat PublishTrimmed lam
      # file setup nho di 3 lan nhung KHIEN WMI tra ve gan nhu khong gi ca -
      # chuong trinh van chay, van sinh du file, bao cao nhin binh thuong, chi
      # la THIEU DU LIEU. Kiem tra "co sinh ra file khong" hoan toan khong bat
      # duoc loi kieu do.
      #
      # Muon thu lai mot thiet lap toi uu hoa nao (cat tia, NativeAOT...): them
      # mot buoc publish thu hai voi thiet lap khac roi so sanh So dong va Tom
      # tat cua hai ban tren CUNG mot may. Khac nhau = thiet lap do lam mat du
      # lieu. Do la cach duy nhat phat hien duoc.
      - name: Quet that va kiem tra du lieu co thuc
        shell: pwsh
        run: |
          # Giu lai dau ra de kiem tra ca NOI DUNG lan CACH no duoc in ra.
          $out = ./publish/swico.exe --scope hardware --silent --no-update-check --no-csv -o out 2>&1
          $exit = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($exit -ge 2) { throw "Quet that bai voi ma thoat $exit" }

          # --- Tien trinh quet phai duoc bao theo TUNG BUOC ---
          #
          # Truoc day ca lan quet chi in ba dong "[1] Dang..." roi im lang hang
          # phut. Buoc kiem tra nay giu cho dieu do khong quay lai: moi buoc thu
          # thap phai co mot dong rieng, kem thoi gian that cua chinh no.
          #
          # Dau tick la "✓" khi console doc duoc UTF-8 va "+" khi khong - chap
          # nhan ca hai, vi ma trang cua runner khong phai thu ta kiem soat.
          $steps = @($out | Where-Object { $_ -match '^\s+(\u2713|\+)\s' })
          Write-Host "So buoc duoc bao: $($steps.Count)"
          if ($steps.Count -lt 10) {
            throw "Chi co $($steps.Count) buoc duoc bao - quet phan cung phai bao >= 10 buoc"
          }

          $timed = @($steps | Where-Object { $_ -match '\d+\.\d+ s\s*$' })
          if ($timed.Count -lt $steps.Count) {
            throw "$($steps.Count - $timed.Count) buoc khong kem thoi gian chay"
          }

          # CHI dung nhan ASCII o day. Nhan buoc co dau tieng Viet, ma ma trang
          # console cua runner khong phai thu ta kiem soat - doi chieu chuoi co
          # dau se bien mot buoc kiem tra dang tin thanh mot buoc do dong bong.
          foreach ($need in @('CPU', 'RAM', 'Windows Defender')) {
            if (-not ($steps -match [regex]::Escape($need))) {
              throw "Thieu buoc '$need' trong danh sach tien trinh"
            }
          }
          Write-Host "Tien trinh quet: $($steps.Count) buoc, tat ca deu co thoi gian rieng"

          $json = Get-ChildItem -Recurse out -Filter *.json | Select-Object -First 1
          $html = Get-ChildItem -Recurse out -Filter *.html | Select-Object -First 1
          $xlsx = Get-ChildItem -Recurse out -Filter *.xlsx | Select-Object -First 1
          foreach ($f in @(@{n='json';v=$json}, @{n='html';v=$html}, @{n='xlsx';v=$xlsx})) {
            if (-not $f.v) { throw "Khong sinh ra file .$($f.n)" }
          }

          $d = Get-Content $json.FullName -Raw | ConvertFrom-Json
          if (-not $d.computerName)  { throw 'JSON thieu computerName' }
          if (-not $d.schemaVersion) { throw 'JSON thieu schemaVersion' }
          if ($d.sections.Count -lt 3) { throw "JSON chi co $($d.sections.Count) muc" }

          $rows = 0
          foreach ($sec in $d.sections) { foreach ($t in $sec.tables) { $rows += $t.rows.Count } }
          Write-Host "So dong du lieu : $rows"
          Write-Host "Tom tat phan cung: $($d.hardwareSummary)"

          # WMI phai tra ve DU LIEU THAT. Ba kiem tra duoi day chinh la nhung gi
          # da phat hien ra su co cat tia.
          if ($rows -lt 12) {
            throw "Chi thu duoc $rows dong - WMI khong tra ve du du lieu (may ao CI binh thuong cho ~15)"
          }
          if (-not $d.hardwareSummary) { throw 'Thieu tom tat phan cung' }
          if ($d.hardwareSummary -match '0 CPU') {
            throw "Tom tat bao 0 CPU - Win32_Processor khong tra ve gi: '$($d.hardwareSummary)'"
          }
          if ($d.hardwareSummary -match '^\s*-\s+-') {
            throw "Hang va model deu rong - Win32_ComputerSystem khong tra ve gi: '$($d.hardwareSummary)'"
          }

          # .xlsx phai la goi OPC hop le, khong phai file rong
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($xlsx.FullName)
          $parts = $zip.Entries.FullName; $zip.Dispose()
          foreach ($need in @('xl/workbook.xml','xl/styles.xml','[Content_Types].xml')) {
            if ($parts -notcontains $need) { throw "File .xlsx thieu phan $need" }
          }
          Write-Host "File .xlsx co $($parts.Count) phan - hop le"

          # swico.exe tra ve 1 khi co muc thieu du lieu (vi du Defender tren may
          # ao). Do KHONG phai loi cua buoc nay, nen phai dat lai de GitHub
          # khong coi ca buoc la that bai.
          exit 0

      - name: Luu ket qua quet de doi chieu khi can
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-quet-${{ github.sha }}
          path: out/**/*.json
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swico-unsigned-${{ github.sha }}
          path: publish/swico.exe
          retention-days: 14
